<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <rect width="1200" height="900" fill="#0b0d13"/>
  <!-- outer frame -->
  <rect x="80" y="60" width="1040" height="780" stroke="#e23b3b" stroke-width="3"/>
  <rect x="100" y="80" width="1000" height="740" stroke="#e23b3b" stroke-width="1.5" opacity=".7"/>

  <!-- garage -->
  <rect x="140" y="620" width="920" height="160" stroke="#e23b3b" stroke-width="2"/>
  <text x="160" y="650" fill="#3de7ff" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">GARAJ</text>
  <text x="160" y="675" fill="#3de7ff" font-family="Arial,sans-serif" font-size="12" opacity=".8">Alan: 42 m2</text>
  <!-- cars -->
  <rect x="220" y="690" width="140" height="60" rx="8" stroke="#3de7ff" stroke-width="1.5" opacity=".7"/>
  <rect x="420" y="690" width="140" height="60" rx="8" stroke="#3de7ff" stroke-width="1.5" opacity=".7"/>

  <!-- living -->
  <rect x="140" y="120" width="560" height="340" stroke="#e23b3b" stroke-width="2"/>
  <text x="160" y="150" fill="#3de7ff" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">MUTFAK + SALON</text>
  <text x="160" y="175" fill="#3de7ff" font-family="Arial,sans-serif" font-size="12" opacity=".8">Alan: 88 m2</text>
  <!-- sofa -->
  <path d="M180 300 H420 Q460 300 460 340 V380 H180 Z" stroke="#8fdfff" stroke-width="1.5" opacity=".8"/>
  <rect x="500" y="280" width="150" height="50" stroke="#8fdfff" stroke-width="1.2" opacity=".7"/>
  <!-- kitchen island -->
  <rect x="180" y="200" width="180" height="40" stroke="#8fdfff" stroke-width="1.2"/>

  <!-- antre -->
  <rect x="700" y="120" width="160" height="200" stroke="#e23b3b" stroke-width="2"/>
  <text x="720" y="150" fill="#3de7ff" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">ANTRE</text>
  <text x="720" y="172" fill="#3de7ff" font-family="Arial,sans-serif" font-size="11" opacity=".8">Alan: 12 m2</text>

  <!-- stairs -->
  <g stroke="#e23b3b" stroke-width="1.2">
    <line x1="740" y1="220" x2="820" y2="220"/><line x1="740" y1="235" x2="820" y2="235"/>
    <line x1="740" y1="250" x2="820" y2="250"/><line x1="740" y1="265" x2="820" y2="265"/>
    <line x1="740" y1="280" x2="820" y2="280"/>
  </g>

  <!-- bedroom 1 -->
  <rect x="860" y="120" width="240" height="220" stroke="#e23b3b" stroke-width="2"/>
  <text x="880" y="150" fill="#3de7ff" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">YATAK ODASI</text>
  <text x="880" y="172" fill="#3de7ff" font-family="Arial,sans-serif" font-size="11" opacity=".8">Alan: 18 m2</text>
  <rect x="920" y="210" width="120" height="70" stroke="#8fdfff" stroke-width="1.2"/>

  <!-- bedroom 2 -->
  <rect x="700" y="340" width="200" height="200" stroke="#e23b3b" stroke-width="2"/>
  <text x="720" y="370" fill="#3de7ff" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">YATAK ODASI</text>
  <text x="720" y="392" fill="#3de7ff" font-family="Arial,sans-serif" font-size="11" opacity=".8">Alan: 14 m2</text>
  <rect x="740" y="420" width="110" height="70" stroke="#8fdfff" stroke-width="1.2"/>

  <!-- bath -->
  <rect x="900" y="340" width="200" height="120" stroke="#e23b3b" stroke-width="2"/>
  <text x="920" y="370" fill="#3de7ff" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">BANYO</text>
  <text x="920" y="392" fill="#3de7ff" font-family="Arial,sans-serif" font-size="11" opacity=".8">Alan: 8 m2</text>
  <circle cx="960" cy="430" r="16" stroke="#8fdfff" stroke-width="1.2"/>
  <rect x="1000" y="410" width="60" height="30" stroke="#8fdfff" stroke-width="1.2"/>

  <!-- laundry -->
  <rect x="900" y="460" width="200" height="80" stroke="#e23b3b" stroke-width="2"/>
  <text x="920" y="490" fill="#3de7ff" font-family="Arial,sans-serif" font-size="14" letter-spacing="1">Ç. ODASI</text>
  <text x="920" y="512" fill="#3de7ff" font-family="Arial,sans-serif" font-size="11" opacity=".8">Alan: 6 m2</text>

  <!-- corridor -->
  <rect x="140" y="460" width="560" height="160" stroke="#e23b3b" stroke-width="2" opacity=".5"/>

  <!-- dimensions -->
  <text x="520" y="50" fill="#3de7ff" font-family="Arial,sans-serif" font-size="14">1110</text>
  <text x="40" y="460" fill="#3de7ff" font-family="Arial,sans-serif" font-size="14" transform="rotate(-90 40 460)">880</text>
  <text x="420" y="860" fill="#c6a15b" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">ZEM0N KAT PLANI · 180 m²</text>

  <!-- grid dots subtle -->
  <g fill="#3de7ff" opacity=".15">
    <circle cx="200" cy="200" r="1.5"/><circle cx="400" cy="250" r="1.5"/><circle cx="600" cy="180" r="1.5"/>
    <circle cx="800" cy="400" r="1.5"/><circle cx="950" cy="550" r="1.5"/>
  </g>
</svg>
