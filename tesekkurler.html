<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Teşekkürler</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20260203_final" />
  <style>
    .ty-card{
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      border-radius:18px;
      padding:28px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .ty-title{
      color:#111 !important;
      font-weight:700;
      letter-spacing:-0.02em;
      font-size:36px;
      line-height:1.05;
      margin:0 0 10px;
    }
    .ty-text{
      color:rgba(17,17,17,.78) !important;
      font-size:15px;
      line-height:1.7;
      margin:0 0 18px;
    }
    .ty-btn{
      display:inline-block;
      padding:12px 18px;
      border-radius:999px;
      text-decoration:none;
      border:1px solid rgba(0,0,0,.14);
      color:#111 !important;
      background:#fff;
    }
    .ty-btn:hover{
      border-color: rgba(0,0,0,.22);
    }
  </style>
</head>
<body>
  <main style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:48px 16px;">
    <div style="max-width:560px;text-align:center;">
      <h1 style="margin:0 0 10px;">Mesajınız alındı</h1>
      <p style="margin:0 0 22px;line-height:1.6;">
        En kısa sürede size dönüş yapacağız.
      </p>
      <a href="index.html" style="display:inline-block;padding:12px 18px;border-radius:999px;border:1px solid rgba(0,0,0,.12);text-decoration:none;">
        Anasayfaya dön
      </a>
    </div>
  </main>

</html>
